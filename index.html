<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2eb"><title>Italy & Spain · Travel Companion</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Travel Companion"><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--ink:#242923;--muted:#7b7d75;--cream:#f6f2eb;--paper:#fffdf9;--green:#375e4b;--sage:#e8ede5;--gold:#b17d49;--line:#e9e3d8}*{box-sizing:border-box}body{margin:0;background:#e9e5dd;color:var(--ink);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;background:var(--cream);min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{background:#f1ede5;border-right:1px solid var(--line);padding:30px 20px;position:sticky;top:0;height:100vh}.brand{font-family:'Playfair Display',Georgia,serif;font-size:26px;line-height:1.12;margin:8px 0 6px}.eyebrow{font-size:10px;letter-spacing:.21em;font-weight:700;color:var(--green);text-transform:uppercase}.sub{color:var(--muted);font-size:12px}.nav{margin-top:40px;display:grid;gap:8px}.nav button,.bottom button{border:0;background:transparent;text-align:left;color:#64675e;padding:12px 14px;border-radius:13px;font-size:13px;font-weight:600}.nav button.active{background:var(--green);color:white}.nav button:hover{background:#dce5db;color:var(--ink)}.nav button.active:hover{background:var(--green);color:white}.sidebar-foot{position:absolute;bottom:25px;font-size:11px;color:var(--muted);line-height:1.7}.main{min-width:0;padding:36px 46px 100px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{display:inline-block;padding:6px 11px;background:var(--sage);border-radius:20px;font-size:11px;color:var(--green);font-weight:700}.hero{position:relative;margin-top:20px;min-height:285px;border-radius:21px;overflow:hidden;background:linear-gradient(110deg,rgba(24,35,31,.9),rgba(39,53,43,.35)),linear-gradient(145deg,#a7855e,#3f6157 70%);color:white;padding:32px;display:flex;flex-direction:column;justify-content:space-between}.hero:after{content:'✦';position:absolute;font-size:320px;right:-18px;top:-112px;color:#ffffff14;font-family:Georgia}.hero h1{font:500 clamp(36px,5vw,64px)/1.05 'Playfair Display',Georgia,serif;margin:13px 0}.hero p{max-width:370px;font-size:13px;line-height:1.8;color:#e8e8dc}.hero-bottom{display:flex;gap:28px;font-size:12px}.hero-bottom b{display:block;font-size:23px;font-family:Georgia}.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:32px 0 15px}.section-title h2{font:600 27px 'Playfair Display',Georgia,serif;margin:0}.section-title small{color:var(--muted);font-size:12px}.cities{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.city{border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:13px 8px;text-align:center;min-width:0}.city .emoji{font-size:25px}.city b{display:block;font-size:11px;margin-top:7px}.city small{display:block;color:var(--muted);font-size:9px;margin-top:5px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.card h3{font-size:16px;margin:5px 0 8px}.card p{color:#5f645b;font-size:13px;line-height:1.75;margin:7px 0}.label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}.tag{display:inline-block;font-size:10px;padding:5px 9px;border-radius:20px;background:#efece4;color:#665f53;white-space:nowrap}.tag.done{background:#e0eee3;color:#2d6647}.tag.watch{background:#fff0d9;color:#9a641e}.tag.optional{background:#edf0f3;color:#66717c}.tag.todo{background:#f7e8e3;color:#a26252}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:7px;scrollbar-width:thin}.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:50px;padding:10px 13px;font-size:12px}.chip.active{background:var(--green);color:white;border-color:var(--green)}.timeline{border-left:1px solid #d4d9d0;margin:17px 0 12px 9px;padding-left:19px}.event{position:relative;padding:0 0 20px}.event:before{content:'';position:absolute;left:-24px;top:5px;width:9px;height:9px;background:#8b9f8a;border:3px solid var(--paper);border-radius:50%}.event time{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.event strong{font-size:13px}.hint{padding:12px 14px;background:#f0f2eb;border-radius:12px;font-size:12px;color:#536552;line-height:1.6}.action{border:1px solid #d5dfd3;color:var(--green);background:#f6faf5;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700}.action.primary{background:var(--green);color:white}.action:hover{filter:brightness(.96)}.foodgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.foodgrid .card{margin:0}.foodmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted);font-size:12px}.search{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:13px;margin-bottom:12px;outline-color:var(--green)}.task{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.task input{accent-color:var(--green);width:17px;height:17px}.task.done span{text-decoration:line-through;color:#92988e}.task small{margin-left:auto;color:var(--muted);white-space:nowrap}.progress{height:8px;background:#e5e4dc;border-radius:10px;overflow:hidden;margin:13px 0 6px}.progress>div{height:100%;background:var(--green);transition:width .2s}.hotelgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hotelgrid .card{margin:0}.textarea{width:100%;min-height:170px;padding:14px;border-radius:12px;border:1px solid var(--line);resize:vertical;background:white;line-height:1.7;color:var(--ink)}.bottom{display:none}.footnote{font-size:11px;color:var(--muted);line-height:1.7}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:800px){.shell{display:block;max-width:600px}.sidebar{display:none}.main{padding:20px 18px 105px}.hero{min-height:290px;padding:24px}.cities{display:flex;overflow:auto;padding-bottom:7px}.city{min-width:92px}.foodgrid,.hotelgrid{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffdf9f5;backdrop-filter:blur(12px);border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom button{text-align:center;padding:7px 5px;font-size:10px;min-width:58px}.bottom button span{display:block;font-size:20px;margin-bottom:3px}.bottom button.active{color:var(--green);background:var(--sage)}.hero h1{font-size:45px}.section-title h2{font-size:25px}}@media(max-width:390px){.hero h1{font-size:39px}.hero-bottom{gap:16px}.topline .sub{font-size:10px}}
 .field{display:grid;gap:5px;margin:10px 0;font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;background:white;padding:11px;color:var(--ink);width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{font-size:11px;color:var(--muted)}.expense-total{font:500 35px Georgia,serif;color:var(--green)}.event-edit{background:#f5f3ed;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}@media(max-width:550px){.two{grid-template-columns:1fr}.bottom button{min-width:0;flex:1;font-size:9px;padding:7px 1px}} </style></head><body><div class="shell"><aside class="sidebar"><div class="eyebrow">Personal travel journal</div><div class="brand">Italy <i>&</i><br>Spain.</div><div class="sub">Winter journey · 2026—27</div><div class="nav" id="sideNav"></div><div class="sidebar-foot">Made for two ✦<br>Private travel companion<br><span>Private PWA · v2.5</span></div></aside><main class="main" id="app"></main></div><nav class="bottom" id="bottomNav"></nav><script>
/* The hosted app contains no personal itinerary. Import the private JSON on your device. */
const TRIP_STORAGE='italy-spain-private-trip-v1';
function welcome(){document.getElementById('app').innerHTML=`<section style="max-width:560px;margin:9vh auto;padding:24px"><div class="eyebrow">PRIVATE TRAVEL COMPANION</div><h1>Italy <i>&</i> Spain.</h1><h2>导入你的私人旅行资料</h2><p>这个网页程序不包含你的航班、酒店或行程。首次使用时，从手机「文件」App 中选择私人 JSON 文件，资料只保存在此设备的浏览器中。</p><label class="action primary" style="display:inline-block;cursor:pointer;padding:13px 18px">选择私人旅行 JSON<input type="file" accept=".json,application/json" style="display:none" onchange="loadPrivateTrip(event)"></label><p class="mini" style="margin-top:20px">建议安装到 iPhone 主屏幕后，再在主屏幕 App 内导入。数据不自动跨设备同步；请定期导出备份。</p></section>`}
function loadPrivateTrip(event){const f=event.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.cities)||!Array.isArray(d.days)||!Array.isArray(d.food)||!Array.isArray(d.flights)||!Array.isArray(d.tasks))throw Error('invalid');localStorage.setItem(TRIP_STORAGE,JSON.stringify(d));location.reload()}catch(err){alert('无法读取旅行资料，请选择 Italy_Spain_Private_Trip_Data_v2_5.json。')}};r.readAsText(f)}
let PRIVATE_DATA=null;try{PRIVATE_DATA=JSON.parse(localStorage.getItem(TRIP_STORAGE)||'null')}catch(e){}
if(!PRIVATE_DATA){welcome()}else{startApp(PRIVATE_DATA)}
function startApp(DATA){
const TABS=[['home','⌂','首页'],['days','◷','行程'],['food','♧','美食'],['bookings','✓','待办'],['expenses','€','消费'],['memo','☷','备忘录'],['more','✦','资料']];
let tab='home',dayIndex=0,foodCity='全部',search='',taskFilter='all';
const STORAGE='italy-spain-companion-v2';let state={checks:{},notes:'',eventEdits:{},taskDetails:{},flights:{},expenses:[],memos:[],hotels:{}};try{state={...state,...JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem('italy-spain-companion-v1')||'{}')}}catch(e){};
// Upgrade known old flight placeholders while preserving intentional custom edits.
if(!state.schemaVersion||state.schemaVersion<3){let old={f0:['','',''],f1:['','Rome','06:30'],f3:['','',''],f4:['Madrid','','11:00'],f5:['','',''],f6:['','','']};for(let f of DATA.flights){let edit=state.flights?.[f.id];if(!edit)continue;if(f.id==='f3'&&!edit.number)edit.number='VY1108';if(f.id==='f1'&&edit.arrive==='06:30')edit.arrive='06:40';if(f.id==='f4'&&edit.depart==='11:00')edit.depart='11:05';}state.schemaVersion=3}
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusNames={confirmed:'已确定',done:'已完成',planned:'计划中',watch:'待放票',todo:'待预订',optional:'备选'};
function badge(status){return `<span class="tag ${status}">${statusNames[status]||status}</span>`}
function mapLink(name,city){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+' '+city+' Spain Italy')}
function nav(){document.getElementById('sideNav').innerHTML=TABS.map(([id,ico,title])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')">${ico} &nbsp; ${title}</button>`).join('');document.getElementById('bottomNav').innerHTML=TABS.map(([id,ico,title])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')"><span>${ico}</span>${title}</button>`).join('')}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
function header(kicker,title,desc=''){return `<div class="section-title"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2></div></div>${desc?`<p class="muted">${desc}</p>`:''}`}
function home(){const next=DATA.days[dayIndex];return `<div class="topline"><span class="eyebrow">YOUR PRIVATE JOURNEY</span><span class="pill">16 DEC 2026 — 01 JAN 2027</span></div><div class="hero"><div><div style="font-size:11px;letter-spacing:.18em">A WINTER STORY IN EUROPE</div><h1>Italy <i>&</i><br>Spain.</h1><p>从罗马的艺术，到安达卢西亚的庭院，再到马德里的新年钟声。一本只属于你们的旅行手册。</p></div><div class="hero-bottom"><div><b>17</b>DAYS</div><div><b>7</b>CITIES</div><div><b>2</b>TRAVELLERS</div></div></div>${header('THE ROUTE','Seven cities, one journey')}<div class="cities">${DATA.cities.map((c,i)=>`<button class="city" onclick="goCity('${c.id}')"><div class="emoji">${c.emoji}</div><b>${c.cn}</b><small>${c.dates}</small></button>`).join('')}</div>${header('YOUR DAY BY DAY','旅程一览','点击日期进入当天完整时间轴，支持编辑和状态同步。')}<div class="card"><div class="row"><div><div class="label">START HERE</div><h3>${next.date} · ${next.title}</h3><p>${next.events.length} 个行程节点 · ${next.note}</p></div><button class="action primary" onclick="setTab('days')">查看行程 →</button></div></div><div class="card"><div class="row"><div><div class="label">NEW YEAR'S EVE</div><h3>Madrid · Rooftop countdown</h3><p>GINA / RIU 360° / Inhala Terraza 三家候选；酒店邮件回复尚待确认。</p></div><span style="font-size:32px">✧</span></div></div><div class="hint">✦ 所有行程均为规划草案。已订、备选与待确认信息明确区分；节假日开放和价格请在预订前再次核实。</div>`}
function goCity(id){let i=DATA.days.findIndex(d=>d.city===id);dayIndex=Math.max(0,i);setTab('days')}
function eventValue(d,i){return {...d.events[i],...(state.eventEdits[d.date+':'+i]||{})}}
function taskForEvent(date,title){return DATA.tasks.find(t=>t.date===date&&(title.includes(t.title)||t.title.includes(title)|| (t.title==='Casa de la Memoria'&&title.includes('弗拉门戈')) || (t.title==='普拉多博物馆'&&title.includes('普拉多')) || (t.title==='阿尔罕布拉宫 09:00'&&title.includes('纳斯里德')) || (t.title==='塞维利亚主教座堂'&&title.includes('主教座堂')) || (t.title==='佛罗伦萨牛排'&&title.includes('牛排'))))}
function eventStatus(d,i){let e=eventValue(d,i),t=taskForEvent(d.date,e.title);return t&&isDone(t)?'done':e.status}
function editEvent(i){let d=DATA.days[dayIndex],e=eventValue(d,i);document.getElementById('eventEdit'+i).innerHTML=`<div class="event-edit"><label class="field">时间<input id="evTime" value="${escapeHtml(e.time)}"></label><label class="field">行程内容<input id="evTitle" value="${escapeHtml(e.title)}"></label><label class="field">状态<select id="evStatus">${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${e.status===k?'selected':''}>${v}</option>`).join('')}</select></label><button class="action primary" onclick="saveEvent(${i})">保存到行程</button> <button class="action" onclick="render()">取消</button></div>`}
function saveEvent(i){let d=DATA.days[dayIndex];state.eventEdits[d.date+':'+i]={time:document.getElementById('evTime').value,title:document.getElementById('evTitle').value,status:document.getElementById('evStatus').value};save();render()}
function days(){let d=DATA.days[dayIndex];return `${header('THE ITINERARY','每日行程','完成待办会同步更新匹配的行程状态；时间与项目也可单独编辑。')}<div class="chips">${DATA.days.map((x,i)=>`<button class="chip ${dayIndex===i?'active':''}" onclick="dayIndex=${i};render()">${x.date}</button>`).join('')}</div><div class="card" style="margin-top:10px"><div class="label">${escapeHtml(d.city)} · ${d.date}</div><h3 style="font:600 25px Georgia,serif;margin:12px 0">${escapeHtml(d.title)}</h3><div class="timeline">${d.events.map((orig,i)=>{let e=eventValue(d,i);return `<div class="event"><time>${escapeHtml(e.time)}</time><div class="row" style="align-items:start"><strong>${escapeHtml(e.title)}</strong>${badge(eventStatus(d,i))}</div><button class="action" style="margin-top:7px;padding:5px 9px" onclick="editEvent(${i})">编辑</button><div id="eventEdit${i}"></div></div>`}).join('')}</div><div class="hint">${escapeHtml(d.note)}</div></div><div class="row"><button class="action" onclick="dayIndex=Math.max(0,dayIndex-1);render()">← 上一天</button><button class="action" onclick="dayIndex=Math.min(DATA.days.length-1,dayIndex+1);render()">下一天 →</button></div>`}
function food(){let arr=DATA.food.filter(f=>(foodCity==='全部'||f.city===foodCity)&&[f.name,f.reason,f.date].join(' ').toLowerCase().includes(search.toLowerCase()));return `${header('THE FOOD EDIT','餐厅与备选','推荐理由、备选逻辑与尚待确认事项。')}<input class="search" placeholder="搜索餐厅、菜系、日期…" value="${escapeHtml(search)}" oninput="search=this.value;updateFoodList()"><div class="chips">${['全部',...DATA.cities.map(x=>x.id)].map(c=>`<button class="chip ${foodCity===c?'active':''}" onclick="foodCity='${c}';render()">${c==='全部'?'全部':DATA.cities.find(x=>x.id===c).cn}</button>`).join('')}</div><div id="foodList" class="foodgrid" style="margin-top:10px">${foodCards(arr)}</div><p class="footnote">注意：这是已讨论的推荐资料库，不表示餐厅已经预订或已确认圣诞、新年营业。所有餐厅均为候选，尚未表示已预订；节日营业请再次确认。</p>`}
function foodCards(arr){return arr.length?arr.map(f=>`<article class="card"><div class="row"><span class="label">${escapeHtml(f.city)} · ${escapeHtml(f.date)}</span><span class="tag">${escapeHtml(f.rank)}</span></div><h3>${escapeHtml(f.name)}</h3><p>${escapeHtml(f.reason)}</p><p style="font-size:12px;color:#8b6c4b">待确认：${escapeHtml(f.note)}</p>${f.name.includes('待')||f.name==='演出后晚餐'? '':`<a class="action" style="display:inline-block;text-decoration:none;margin-top:7px" href="${mapLink(f.name,f.city)}" target="_blank" rel="noopener">地图搜索 ↗</a>`}</article>`).join(''):'<div class="empty">没有找到匹配的餐厅。</div>'}
function updateFoodList(){document.getElementById('foodList').innerHTML=foodCards(DATA.food.filter(f=>(foodCity==='全部'||f.city===foodCity)&&[f.name,f.reason,f.date].join(' ').toLowerCase().includes(search.toLowerCase())))}
function isDone(t){return state.checks[t.id]===undefined?t.status==='done':state.checks[t.id]}
function toggleTask(id,checked){state.checks[id]=checked;save();render()}
function taskDetails(id){let t=DATA.tasks.find(x=>x.id===id),v=state.taskDetails[id]||{};document.getElementById('detail'+id).innerHTML=`<div class="event-edit"><div class="two"><label class="field">确认时间<input id="dtTime" placeholder="例如 09:30" value="${escapeHtml(v.time||'')}"></label><label class="field">订单参考（可选）<input id="dtRef" value="${escapeHtml(v.ref||'')}"></label></div><label class="field">补充备注<input id="dtNote" value="${escapeHtml(v.note||'')}"></label><button class="action primary" onclick="saveTaskDetail('${id}')">保存信息</button></div>`}
function saveTaskDetail(id){state.taskDetails[id]={time:document.getElementById('dtTime').value,ref:document.getElementById('dtRef').value,note:document.getElementById('dtNote').value};save();render()}
function bookings(){let done=DATA.tasks.filter(isDone).length;let arr=DATA.tasks.filter(t=>taskFilter==='all'||(taskFilter==='open'?!isDone(t):t.type===taskFilter));return `${header('YOUR CHECKLIST','预订与待办','勾选完成会自动反映在对应日期的行程状态中。')}<div class="card"><div class="row"><b>准备进度</b><b>${done} / ${DATA.tasks.length}</b></div><div class="progress"><div style="width:${done/DATA.tasks.length*100}%"></div></div><p class="muted">点击「详情」可记录确认时间、订单参考和备注。</p></div><div class="chips">${[['all','全部'],['open','未完成'],['ticket','门票'],['train','火车'],['food','餐饮']].map(([id,n])=>`<button class="chip ${taskFilter===id?'active':''}" onclick="taskFilter='${id}';render()">${n}</button>`).join('')}</div><div class="card" style="margin-top:10px">${arr.map(t=>`<div><label class="task ${isDone(t)?'done':''}"><input type="checkbox" ${isDone(t)?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><span>${escapeHtml(t.title)}</span><small>${escapeHtml(t.date)}</small></label><div class="row" style="padding:3px 0 12px"><span class="mini">${escapeHtml([state.taskDetails[t.id]?.time,state.taskDetails[t.id]?.note].filter(Boolean).join(' · '))}</span><button class="action" onclick="taskDetails('${t.id}')">详情 / 更新</button></div><div id="detail${t.id}"></div></div>`).join('')||'<div class="empty">这组任务已全部完成 ✦</div>'}</div>`}
function more(){return `${header('HOTELS','酒店与订单','可取消状态及订购平台按已确认的信息填写；可点击编辑保存变更。')}<div class="hotelgrid">${DATA.cities.map(c=>{let x={...c,...(state.hotels[c.id]||{})};return `<div class="card"><div class="row"><span class="label">${c.cn}</span><span class="tag done">已订</span></div><h3>${escapeHtml(x.hotel)}</h3><p>${escapeHtml(x.dates)}</p><p><b>预订平台：</b>${escapeHtml(x.platform||'待确认')}</p><p><b>取消政策：</b>${escapeHtml(x.cancellation||x.refund||'待确认')}</p><div class="row"><a class="action" style="text-decoration:none" href="${mapLink(x.hotel,c.id)}" target="_blank" rel="noopener">地图 ↗</a><button class="action" onclick="editHotel('${c.id}')">编辑酒店信息</button></div><div id="hotel${c.id}"></div></div>`}).join('')}</div>${header('FLIGHTS','完整航班','航班号、机场和当地时间；点击可修改并保存在当前浏览器。')}<div class="hotelgrid">${flightCards()}</div><div class="row" style="margin-top:20px"><button class="action primary" onclick="exportData()">导出进度 JSON ↓</button><button class="action" onclick="document.getElementById('importFile').click()">导入备份 ↑</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"><p class="footnote">仅保存在当前浏览器；请定期导出 JSON 备份。酒店取消截止时间与实际条款请以预订订单为准。</p>`}
function editHotel(id){let c=DATA.cities.find(x=>x.id===id),x={...c,...(state.hotels[id]||{})};document.getElementById('hotel'+id).innerHTML=`<div class="event-edit"><label class="field">酒店名称<input id="hotelName" value="${escapeHtml(x.hotel)}"></label><label class="field">预订平台<input id="hotelPlatform" value="${escapeHtml(x.platform||'')}"></label><label class="field">取消政策 / 截止日期<input id="hotelCancellation" value="${escapeHtml(x.cancellation||'')}"></label><button class="action primary" onclick="saveHotel('${id}')">保存酒店信息</button></div>`}
function saveHotel(id){state.hotels[id]={hotel:document.getElementById('hotelName').value,platform:document.getElementById('hotelPlatform').value,cancellation:document.getElementById('hotelCancellation').value};save();render()}
function memo(){return `${header('LITTLE THINGS','私人备忘录','独立记录琐碎事项，支持添加、划掉完成、删除。')}<div class="card"><form id="memoForm" onsubmit="event.preventDefault();addMemo()"><label class="field">新备忘<textarea name="memoText" rows="3" placeholder="例如：记得买转换插头、确认行李寄存……" required></textarea></label><button class="action primary" type="submit">＋ 添加备忘</button></form></div><div class="card">${(state.memos||[]).length?(state.memos||[]).map(x=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line);gap:12px;align-items:flex-start"><label class="task ${x.done?'done':''}" style="flex:1;min-width:0"><input type="checkbox" ${x.done?'checked':''} onchange="toggleMemo('${x.id}',this.checked)"><span style="overflow-wrap:anywhere;white-space:pre-wrap">${escapeHtml(x.text)}</span></label><button class="action" onclick="deleteMemo('${x.id}')">删除</button></div>`).join(''):'<p class="muted">还没有备忘，随时添加第一条。</p>'}</div><p class="footnote">备忘保存在本地浏览器，并包含在资料页面导出的 JSON 备份中。</p>`}
function addMemo(){let v=document.getElementById('memoForm').elements.memoText.value.trim();if(!v)return;state.memos=state.memos||[];state.memos.push({id:Date.now().toString()+Math.random().toString(36).slice(2,6),text:v,done:false});save();render()}
function toggleMemo(id,done){let x=(state.memos||[]).find(x=>x.id===id);if(x)x.done=done;save();render()}
function deleteMemo(id){if(!confirm('确定删除这条备忘吗？'))return;state.memos=(state.memos||[]).filter(x=>x.id!==id);save();render()}
const FLIGHTS=DATA.flights;
function flightCards(){return FLIGHTS.map(f=>{let x={...f,...(state.flights[f.id]||{})};return `<div class="card"><div class="row"><span class="label">${x.date} · ${escapeHtml(x.route)}</span><span class="tag done">已订</span></div><h3>${escapeHtml(x.airline||'航空公司待补充')} ${escapeHtml(x.number||'')}</h3><p><b>${escapeHtml(x.from||'—')} ${escapeHtml(x.depart||'--:--')}</b> → <b>${escapeHtml(x.to||'—')} ${escapeHtml(x.arrive||'--:--')}</b></p><p class="mini">${escapeHtml(x.note||'')}</p><button class="action" onclick="editFlight('${f.id}')">编辑航班详情</button><div id="flight${f.id}"></div></div>`}).join('')}
function editFlight(id){let x={...FLIGHTS.find(f=>f.id===id),...(state.flights[id]||{})};let fields=[['airline','航空公司'],['number','航班号'],['from','出发机场'],['to','到达机场'],['depart','起飞时间'],['arrive','抵达时间'],['note','备注 / 行李']];document.getElementById('flight'+id).innerHTML=`<div class="event-edit"><div class="two">${fields.map(([k,l])=>`<label class="field">${l}<input id="fl_${k}" value="${escapeHtml(x[k]||'')}"></label>`).join('')}</div><button class="action primary" onclick="saveFlight('${id}')">保存航班</button></div>`}
function saveFlight(id){let v={};for(let k of ['airline','number','from','to','depart','arrive','note'])v[k]=document.getElementById('fl_'+k).value;state.flights[id]=v;save();render()}
const EXP_CATS=['住宿','机票','火车交通','景点门票','餐饮','购物','市内交通','其他'];
function addExpense(){let f=document.getElementById('expenseForm');let o={id:Date.now().toString(),date:f.elements.date.value,city:f.elements.city.value,category:f.elements.category.value,description:f.elements.description.value,amount:Number(f.elements.amount.value),currency:f.elements.currency.value,paid:true};if(!o.description||!o.amount||o.amount<=0){alert('请输入项目名称和有效金额');return}state.expenses.push(o);save();render()}
function removeExpense(id){if(!confirm('删除这条消费记录？'))return;state.expenses=state.expenses.filter(x=>x.id!==id);save();render()}
function expenses(){let arr=state.expenses||[];let sums={};for(let x of arr){let k=x.currency||'EUR';sums[k]=(sums[k]||0)+Number(x.amount||0)};return `${header('THE SPENDING JOURNAL','消费记录','只记录实际消费，不设置预算或预计费用；不同币种分开统计。')}<div class="card"><div class="label">当前消费合计（按币种）</div>${Object.keys(sums).length?Object.entries(sums).map(([k,v])=>`<div class="expense-total">${k} ${v.toFixed(2)}</div>`).join(''):'<p class="muted">还没有消费记录。可以从机票、酒店和门票开始录入。</p>'}<p class="mini">已记录 ${arr.length} 笔实际消费</p></div><div class="card"><h3>＋ 新增一笔消费</h3><form id="expenseForm" onsubmit="event.preventDefault();addExpense()"><div class="two"><label class="field">日期<input name="date" type="date" value="2026-12-16"></label><label class="field">城市<select name="city">${DATA.cities.map(c=>`<option value="${c.cn}">${c.cn}</option>`).join('')}</select></label><label class="field">类别<select name="category">${EXP_CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="field">币种<select name="currency"><option value="EUR">EUR €</option><option value="AUD">AUD $</option><option value="CNY">CNY ¥</option></select></label></div><label class="field">项目名称<input name="description" placeholder="例如 普拉多门票" required></label><label class="field">金额<input name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></label><button class="action primary" type="submit">保存消费</button></form></div>${header('TRANSACTION HISTORY','消费明细')}<div class="card">${arr.length?arr.slice().reverse().map(x=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${escapeHtml(x.description)}</b><div class="mini">${escapeHtml(x.date)} · ${escapeHtml(x.city)} · ${escapeHtml(x.category)}</div></div><div style="text-align:right"><b>${escapeHtml(x.currency)} ${Number(x.amount).toFixed(2)}</b><div><button class="action" onclick="removeExpense('${x.id}')">删除</button></div></div></div>`).join(''):'<p class="muted">暂无明细。</p>'}</div><p class="footnote">消费和行程编辑保存在当前设备浏览器；请在「资料」页面导出 JSON 备份。不同设备不会自动同步。</p>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'ItalySpainTravelCompanion',version:3,savedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='italy-spain-trip-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(obj.app!=='ItalySpainTravelCompanion'||typeof obj.state!=='object')throw Error('invalid');if(!confirm('导入将覆盖当前设备的勾选和备注，继续吗？'))return;state={checks:obj.state.checks||{},notes:obj.state.notes||'',eventEdits:obj.state.eventEdits||{},taskDetails:obj.state.taskDetails||{},flights:obj.state.flights||{},expenses:obj.state.expenses||[],memos:obj.state.memos||[],hotels:obj.state.hotels||{},schemaVersion:3};save();render();alert('备份已导入')}catch(e){alert('文件格式不正确')}};r.readAsText(f)}
function render(){nav();document.getElementById('app').innerHTML=({home,days,food,bookings,expenses,memo,more}[tab])()};render();
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
